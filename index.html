<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sublime Comporta Guest App</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500;600;700&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--ink:#2F2624;--bg:#F2EEE9;--sand:#D3BF9E;--gold:#9C4E35;--lsand:#E6D9C4;--paper:#FBF9F6;--warm:#B85C3A;--ice:#7C8E78;--mut:rgba(47,38,36,.62);--line:rgba(113,100,84,.28);--c:"DM Sans",system-ui,sans-serif;--f:"Instrument Serif",Georgia,serif;--s:1}
html,body{height:100%}
body{font-variant-numeric:lining-nums;font-family:var(--c);background:#E4DED6;color:var(--ink);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
.top{height:62px;display:flex;align-items:center;gap:14px;padding:0 24px;background:var(--ink);color:#fff}
.top img{height:36px;display:block}
.top small{font-size:13.5px;color:rgba(255,255,255,.6)}
.sp{flex:1}
.tag{font-size:12px;letter-spacing:.12em;text-transform:uppercase;border:1px solid rgba(255,255,255,.3);border-radius:99px;padding:5px 12px;font-weight:600}
.tag.hot{background:var(--sand);color:var(--ink);border-color:var(--sand);font-weight:700}
.tag[aria-pressed=true]{background:#fff;color:var(--ink)}
.layout{display:grid;grid-template-columns:236px 1fr 340px;height:calc(100% - 62px)}
body[data-notes=off] .layout{grid-template-columns:236px 1fr 0}body[data-notes=off] .notes{display:none}
.rail{padding:22px 16px;overflow:auto;border-right:1px solid rgba(113,100,84,.22);background:#ECE6DE}
.rg{margin-bottom:20px}.rg .eb{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);padding:0 10px 8px;font-weight:700}
.ri{display:flex;gap:11px;align-items:center;width:100%;padding:9px 10px;border-radius:10px;font-size:15.5px;font-weight:500;color:#4a3f37}
.ri .n{font-size:12px;color:#a3988c;width:18px;font-variant-numeric:tabular-nums}
.ri:hover{background:rgba(47,38,36,.05)}
.ri[aria-current=true]{background:var(--ink);color:#fff}.ri[aria-current=true] .n{color:rgba(255,255,255,.55)}
.stage{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(900px 620px at 50% 38%,#FAF7F2,#E4DDD3)}
.pw{width:calc(390px*var(--s));height:calc(844px*var(--s));position:relative;flex:none}
.phone{width:390px;height:844px;border-radius:56px;position:absolute;top:0;left:0;transform-origin:0 0;transform:scale(var(--s));background:#000;box-shadow:0 0 0 10px #1f1715,0 0 0 11.5px var(--sand),0 60px 90px -25px rgba(47,38,36,.55)}
.screen{position:absolute;inset:0;border-radius:56px;overflow:hidden;background:var(--bg);color:var(--ink);isolation:isolate}
.hint{display:flex;gap:10px;align-items:center;margin-top:16px;font-size:14px;color:#6e6359}
.hint button{border:1.5px solid var(--ink);border-radius:99px;padding:5px 14px;font-size:14px;font-weight:600;background:#fff}.hint button:disabled{opacity:.3}
.notes{padding:26px 26px 20px;overflow:auto;border-left:1px solid rgba(113,100,84,.22);background:#ECE6DE}
.notes .eb{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:700}
.notes h2{font-family:var(--f);font-weight:400;font-size:42px;margin:6px 0 8px;line-height:1.02}
.notes p.l{font-size:15px;line-height:1.55;color:#574b42}
.notes ul{margin:14px 0 0 18px;font-size:14.5px;line-height:1.55;color:#2d231f}.notes li{margin-bottom:8px}
.why{margin-top:18px;padding:14px 16px;border-radius:14px;background:#fff;border:1px solid var(--sand);box-shadow:3px 3px 0 var(--lsand)}
.why p{font-size:14.5px;line-height:1.5;margin-top:4px}
.foot{font-size:12.5px;line-height:1.55;color:#8c8277;margin-top:20px}
.sbar{position:absolute;top:0;left:0;right:0;height:56px;z-index:60;display:flex;justify-content:space-between;align-items:center;padding:8px 36px 0 40px;font-weight:600;font-size:16px;pointer-events:none;color:var(--ink);transition:color .3s}

.sbar i:after{content:"";position:absolute;inset:1.5px;background:currentColor;border-radius:1px;width:60%}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:36px;border-radius:22px;background:#000;z-index:70;transition:width .55s cubic-bezier(.2,.9,.25,1.05),height .55s cubic-bezier(.2,.9,.25,1.05);overflow:hidden;cursor:pointer;color:#fff}
.island .in{opacity:0;transition:opacity .25s;display:flex;align-items:center;gap:12px;padding:13px 18px;white-space:nowrap}
.island.open{width:358px;height:80px;border-radius:40px}.island.open .in{opacity:1;transition-delay:.2s}
.island .ico{width:42px;height:42px;border-radius:50%;background:var(--sand);color:var(--ink);display:grid;place-items:center;flex:none}
.island b{font-size:16px;font-weight:700;display:block}.island span.s{font-size:13px;color:rgba(255,255,255,.62)}
.island .t{margin-left:auto;font-family:var(--f);font-weight:400;font-size:30px;color:var(--lsand)}

.view.on{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.view.dk{background:var(--ink);color:#fff}

.hd{font-family:var(--f);font-weight:400;letter-spacing:-.01em;line-height:1}

.h2{font-family:var(--f);font-weight:400;font-size:32px;line-height:1.02;letter-spacing:-.01em}
.h2 b{font-weight:400;font-style:italic}
.h3{font-weight:700;font-size:16px;line-height:1.2}
.m{font-size:13.5px;color:var(--mut);line-height:1.45}
.p{font-size:15.5px;line-height:1.55}
.stk{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;background:var(--sand);color:var(--ink);font-weight:700;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.stk.d{background:var(--ink);color:#fff}.stk.w{background:rgba(255,255,255,.92);color:var(--ink)}.stk.o{background:transparent;color:var(--gold);box-shadow:inset 0 0 0 1px var(--sand)}.stk.gl{background:rgba(255,255,255,.2);color:#fff;backdrop-filter:blur(8px)}.stk.warm{background:var(--warm);color:#fff}.stk.ice{background:var(--ice);color:#06222c}
.card{background:var(--paper);border:1px solid var(--line);border-radius:24px;position:relative;overflow:hidden;box-shadow:0 14px 30px -22px rgba(47,38,36,.5)}
.ph{background-size:cover;background-position:center;background-color:#d5ccbf;position:relative}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(32,24,22,.42) 0%,rgba(32,24,22,0) 34%,rgba(32,24,22,.12) 55%,rgba(32,24,22,.88) 100%)}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;height:56px;border-radius:99px;font-family:var(--c);font-weight:700;font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;transition:transform .15s;background:var(--ink);color:#fff}
.btn:active{transform:scale(.97)}
.btn.sand{background:var(--sand);color:var(--ink)}.btn.w{background:#fff;color:var(--ink)}.btn.o{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--sand)}.btn.sm{height:46px;font-size:11.5px}.btn.warm{background:var(--warm);color:#fff}
.btn.ghost{background:rgba(255,255,255,.14);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.5);backdrop-filter:blur(8px)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:99px;font-size:14px;font-weight:600;box-shadow:inset 0 0 0 1px var(--sand);white-space:nowrap;background:transparent;transition:all .2s}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;box-shadow:none}

.row{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:0 20px;scroll-snap-type:x proximity}.row::-webkit-scrollbar{display:none}
.tabbar{position:absolute;left:14px;right:14px;bottom:18px;height:72px;border-radius:36px;z-index:50;display:flex;align-items:center;justify-content:space-around;padding:0 10px;background:rgba(47,38,36,.8);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);box-shadow:0 18px 36px -10px rgba(32,24,22,.6),inset 0 0 0 1px rgba(230,217,196,.3);transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .3s}
.screen[data-tb=off] .tabbar{transform:translateY(130px);opacity:0;pointer-events:none}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--c);font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.6);padding:8px 8px;min-width:56px;transition:color .2s}
.tab[aria-current=true]{color:var(--lsand)}
.tab.kf{width:64px;height:64px;min-width:64px;border-radius:50%;background:linear-gradient(135deg,#ecdcc0,#D3BF9E 60%,#A38C66);color:var(--ink);margin-top:-30px;border:4px solid var(--bg);justify-content:center;box-shadow:0 10px 24px -6px rgba(113,100,84,.8);padding:0}
.bar{display:flex;align-items:center;gap:12px;padding:0 20px 14px}
.back{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;background:#fff;color:var(--ink);box-shadow:0 4px 14px -4px rgba(47,38,36,.4)}
.back.glass{background:rgba(255,255,255,.22);color:#fff;backdrop-filter:blur(10px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}
.dk .back{background:rgba(255,255,255,.16);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
.bento{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border-radius:24px;padding:16px;position:relative;overflow:hidden;min-height:140px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;border:1px solid var(--line);background:var(--paper)}
.big{font-family:var(--f);font-weight:400;font-size:56px;letter-spacing:-.01em;line-height:.95}.big small{font-size:.38em;letter-spacing:0;margin-left:3px;color:var(--mut);font-weight:400}
.pulse{width:9px;height:9px;border-radius:50%;background:#3DBE86;position:relative;display:inline-block;flex:none}
.pulse:after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1.5px solid #3DBE86;animation:pl 1.8s infinite}
@keyframes pl{from{transform:scale(.4);opacity:1}to{transform:scale(1.7);opacity:0}}
.mq{overflow:hidden;white-space:nowrap;font-family:var(--c);font-weight:700;letter-spacing:.18em;text-transform:uppercase;font-size:11px}
.mq div{display:inline-block;animation:mq 30s linear infinite}
@keyframes mq{to{transform:translateX(-50%)}}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:55;border-radius:30px 30px 0 0;padding:10px 20px 32px;transform:translateY(105%);transition:transform .6s cubic-bezier(.2,.85,.25,1);background:var(--paper);box-shadow:0 -24px 50px rgba(32,24,22,.45);color:var(--ink);max-height:92%;overflow-y:auto;scrollbar-width:none}
.sheet.on{transform:none}.sheet .grab{width:48px;height:5px;border-radius:3px;background:var(--sand);margin:0 auto 16px}
.scrim{position:absolute;inset:0;z-index:54;background:rgba(32,24,22,.5);opacity:0;pointer-events:none;transition:opacity .4s}.scrim.on{opacity:1;pointer-events:auto}
.stepper{display:flex;align-items:center;gap:14px}.stepper button{width:40px;height:40px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--sand);font-size:22px;font-weight:500;display:grid;place-items:center}
.stepper b{font-family:var(--f);font-size:36px;font-weight:400;min-width:26px;text-align:center}
.kv{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px;gap:14px}.kv:last-child{border:0}.kv span:first-child{color:var(--mut)}.kv span:last-child{text-align:right;font-weight:700}
.msg{max-width:84%;padding:11px 16px;border-radius:20px;font-size:15.5px;line-height:1.45;animation:up .5s both}
.msg.in{background:#fff;border-bottom-left-radius:6px;align-self:flex-start;box-shadow:0 4px 14px -8px rgba(47,38,36,.5)}
.msg.out{background:var(--ink);color:#fff;border-bottom-right-radius:6px;align-self:flex-end}
.msg small{display:block;font-size:11.5px;opacity:.5;margin-top:5px}
.msg .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.msg .acts button{font-size:13.5px;font-weight:700;padding:7px 14px;border-radius:99px;background:var(--sand)}
.typing{display:flex;gap:4px;padding:15px 16px}.typing i{width:7px;height:7px;border-radius:50%;background:var(--ink);opacity:.4;animation:bl 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,60%,100%{opacity:.2}30%{opacity:.9}}
.toast{position:absolute;left:50%;bottom:116px;transform:translate(-50%,20px);z-index:80;padding:12px 20px;border-radius:99px;font-size:14.5px;font-weight:600;opacity:0;transition:all .4s cubic-bezier(.2,.8,.2,1);white-space:nowrap;background:var(--ink);color:#fff;box-shadow:0 0 0 1.5px var(--sand)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.kenb{position:absolute;inset:-6%;background-size:cover;background-position:50% 50%;animation:kb 26s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.16) translate(-2%,-1%)}}
.keybtn{position:relative;width:112px;height:112px;border-radius:50%;background:linear-gradient(135deg,#ecdcc0,#D3BF9E 55%,#A38C66);color:var(--ink);display:grid;place-items:center;touch-action:none;user-select:none;-webkit-user-select:none;transition:transform .2s,background .3s;flex:none;box-shadow:0 10px 24px -8px rgba(0,0,0,.5),inset 0 0 0 2px rgba(255,255,255,.3)}
.keybtn:active{transform:scale(.95)}.keybtn.ok{background:#2f9e6c;color:#fff}
.keybtn svg.rg{position:absolute;inset:-12px;width:136px;height:136px;transform:rotate(-90deg)}
.keybtn .rp{position:absolute;inset:0;border-radius:50%;border:2px solid #fff;opacity:0}.keybtn.ok .rp{animation:rip 1.2s infinite}
@keyframes rip{from{transform:scale(1);opacity:.8}to{transform:scale(1.9);opacity:0}}
.chk{width:28px;height:28px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--sand);display:grid;place-items:center;flex:none;transition:all .25s;color:transparent;background:#fff}
.chk.on{background:var(--ink);color:var(--lsand);box-shadow:none}
.seg{display:flex;background:#EAE3DA;border-radius:99px;padding:4px;gap:2px}.seg button{flex:1;text-align:center;padding:9px 6px;border-radius:99px;font-weight:700;font-size:13.5px;transition:all .2s;color:var(--mut)}.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.toggle{width:52px;height:30px;border-radius:99px;background:rgba(47,38,36,.2);position:relative;transition:background .25s;flex:none}
.toggle:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .25s;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.toggle[aria-pressed=true]{background:#2f9e6c}.toggle[aria-pressed=true]:after{transform:translateX(22px)}
.pass{background:linear-gradient(160deg,#4a3a33,var(--ink) 60%,#1a1210);color:#fff;border-radius:30px;position:relative;box-shadow:0 22px 40px -18px rgba(47,38,36,.85)}
.pass:before{content:"";position:absolute;left:0;right:0;top:0;height:7px;background:linear-gradient(90deg,var(--sand),#efe4d2,var(--sand));border-radius:30px 30px 0 0}
.perf{position:relative;height:0;border-top:2px dashed rgba(255,255,255,.25);margin:0 22px}
.perf:before,.perf:after{content:"";position:absolute;top:-15px;width:28px;height:28px;border-radius:50%;background:var(--bg)}
.perf:before{left:-36px}.perf:after{right:-36px}
.fld .l{font-size:10px;letter-spacing:.16em;text-transform:uppercase;opacity:.6;font-weight:700}.fld .v{font-family:var(--f);font-weight:400;font-size:24px;margin-top:2px}
.gl{backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);background:rgba(255,255,255,.2);box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.heat{display:flex;gap:5px}.heat i{width:28px;height:8px;border-radius:4px;background:rgba(255,255,255,.2);transition:background .5s}.heat i.on{background:linear-gradient(90deg,#f0b46a,var(--warm))}

.vapor{position:absolute;left:0;right:0;bottom:0;height:60%;background:radial-gradient(60% 80% at 30% 100%,rgba(255,255,255,.25),transparent),radial-gradient(50% 70% at 75% 100%,rgba(255,255,255,.2),transparent);animation:vp 7s ease-in-out infinite alternate;pointer-events:none}
@keyframes vp{from{transform:translateY(8%) scale(1);opacity:.6}to{transform:translateY(-6%) scale(1.15);opacity:1}}
.breath{position:relative;width:250px;height:250px;margin:0 auto;display:grid;place-items:center}
.breath .o,.breath .m2,.breath .c{position:absolute;border-radius:50%}
.breath .o{inset:0;border:1.5px solid rgba(255,255,255,.35)}
.breath .m2{inset:30px;border:1px solid rgba(255,255,255,.2)}
.breath .c{width:120px;height:120px;background:radial-gradient(circle at 35% 30%,#f2e8d6,var(--sand) 65%,#7e7050);box-shadow:0 0 60px rgba(230,217,196,.55);transition:transform 4s cubic-bezier(.45,0,.55,1)}
.breath.in .c{transform:scale(1.75)}.breath.hold .c{transform:scale(1.75);transition-duration:.2s}.breath.out .c{transform:scale(1);transition-duration:8s}

var NOTES={
welcome:["Arrival","Welcome","Sublime Comporta in its own colours: a 68-hectare estate of umbrella pines, cork oaks and dunes, as the resort describes itself, with the Terracotta and Sand wings.",["Real: the Sublime logo, the line &lsquo;A haven of authenticity&rsquo;, and every photo come from sublimehotels.pt.","A ticker with facts guests pick the resort for: the 68-hectare estate, the two wings, the 1,805 m&sup2; bio-pool, the spa open daily 09:00 to 21:00, the beach club on Praia do Carvalhal, about an hour from Lisbon, best online rate guaranteed.","The site is also in Portuguese; the app would follow the guest&rsquo;s language."],"The first screen should sell the place and give one clear next step, not ask for a login."],
home:["Arrival","Today & key card","Arrival day as a key card with a hold-to-unlock button (try it), then tonight&rsquo;s table, golden hour and the welcome drink.",["Real: a Villa Room Standard in the Terracotta wing is a 25 m&sup2; room with a king-size bed, a private deck and shared access to the villa pool and terraces. The direct-booking benefits (best online rate, early check-in and late check-out subject to availability, a welcome drink on arrival day) come from the site.","Real: the December long-weekend offer (valid 27 November to 9 December 2026) and the Christmas banner &lsquo;Discover our Wonderland among the pines&rsquo;.","Placeholders: the guest, villa and room number, the weather and the sunset time. Check-in and check-out times are not published.","The pill at the top is a Live Activity for tonight&rsquo;s table (tap it)."],"A villa estate answers the same questions all day: where is my room, what is on tonight, where do I eat. Today puts the key, the evening and the weather on one screen, so reception handles the guests who need a person."],
room:["Arrival","Villa & upgrades","A Villa Room with the key on the phone, and the next categories up with what the site says about each.",["Real: the room and villa lineup and what each includes, for example the Spa Suite (fireplace, private jacuzzi), the Cabana Suite (private pool), the Bio-Pool Suites (direct access to the natural pool, a salamander stove) and the 2-Bedroom Cabana Villa (160 m&sup2;, pool). Underfloor heating, air conditioning, high-speed internet and 24-hour reception.","Real: the December offer includes breakfast, wellness access in both wings, a complimentary non-alcoholic minibar and a complimentary upgrade, subject to availability.","The site publishes no rates for the upgrade categories, so the cards say &lsquo;rate for your dates&rsquo;; a live version would show them. Room number and key are placeholders; photos are the site&rsquo;s own."],"Upgrades are sold through the booking engine and the front desk. A card with the real features and one tap to ask turns a stay into a bigger booking, and the guest who books the suite for next time is one who saw it in the app."],
map:["Around the estate","Resort map","Sublime Comporta spreads across 68 hectares in two wings. Tap a pin, see the way from your villa, and book from the card.",["Real: the estate (68 hectares, Terracotta and Sand wings), the first building that now houses the spa, the 1,805 m&sup2; bio-pool, the Forum events centre (460 m&sup2;) in the Sand wing, Food Circle in the organic garden, Sem Porta, Beefbar, Aqua (heated indoor pool, outdoor pool, gym), the Kids Club, tennis and padel courts, and the beach club on Praia do Carvalhal.","Hours on the cards are the published ones for December. The pin positions are schematic and illustrative: the resort&rsquo;s own map on its website shows exact positions, and a live version would use it.","The dashed route and the &lsquo;lift&rsquo; idea are concept features."],"The resort added 43 villas and three service buildings in 2026, so even returning guests need to find their way. A map that books is the screen they will open most."],
dine:["Around the estate","Dining","Sem Porta, Beefbar, Food Circle, the Beach Club, Sado and Da Comporta, with seasonal hours and a booking sheet.",["Real: Sem Porta dinner 18:30 to 22:30 in November and December and breakfast 07:30 to 11:00; Beefbar dinner daily 18:30 to 22:30 and a lounge from 12:30 to midnight; Food Circle a single seating at 19:30 on Friday and Saturday (other days from six guests); the Beach Club, Sado and Da Comporta hours for December.","Real: Davvero Comporta is closed for the season and opens for Christmas Eve; Ruína reopens for New Year&rsquo;s Eve.","Table times inside those windows are illustrative; the site books tables by form, email or phone."],"Every restaurant has its own season and days. Showing only what is open on the guest&rsquo;s dates, and confirming in one tap, replaces a lot of email and phone calls."],
well:["Days","Spa & wellness","Spa Terracota, in-room treatments, the gym and yoga, tennis and padel, and the Aqua pools.",["Real: the spa is adults-only and open daily from 09:00 to 21:00, its treatments use ingredients from the organic garden and are booked in advance; the gym is open 06:00 to 22:00 with instructors from 08:00 to 20:00; in-room treatments; tennis and padel with rackets and balls (advance booking); the Aqua area with a heated indoor pool, an outdoor pool and a fitness area.","Real: access to fitness and wellness in both wings is part of the December offer.","Treatment names beyond the site&rsquo;s headings and all times are illustrative; the site publishes a spa menu as a download but no single-treatment prices, so none are shown."],"The spa is the second-largest source of in-stay revenue at most resorts. Booking it, and the gym classes, from the phone fills the day and takes calls off reception."],
out:["Days","Experiences","The Out and In experiences from the website, bookable as requests.",["Real: the bike tour through the rice fields (2 to 3 hours, 10 km, electric bikes available), horse riding on the dunes, birdwatching in the Santo Andr&eacute; reserve (up to 250 species, 1 to 4 people), Dunas Golf (18 holes), boat tours from the Tr&oacute;ia marina, surf, dolphin watching in the Sado estuary; in the estate an ofyr lunch, picnics (12 hours&rsquo; notice), a romantic dinner in the yoga cabana, Chef in Villa and Barman in Villa (minimum 4), and a wine tasting (24 hours&rsquo; notice).","Times are illustrative; prices are not published, so every item is a request that the team confirms."],"Today each experience page ends in a &lsquo;Request Info&rsquo; form. A request from the app with the guest&rsquo;s villa and dates already filled in is faster for the guest and for the team."],
hotel:["Stay","Estate guide","Services, the family offer, pets, Sublime Lisboa and contacts.",["Real: 24-hour reception, air conditioning, underfloor heating and high-speed internet; the Kids Club (extra charge) with activities such as Nature Olympics, animal yoga and Mini Chef workshops, plus babysitters, a lifeguard pool and movie nights; Sublime Paws for guests with pets; Sublime Lisboa (15 rooms and suites in an early-20th-century townhouse in Amoreiras) and the &lsquo;Stay a little longer&rsquo; offer from &euro;1,500 for three nights with airport transfers.","Real: the contacts and addresses for both hotels."],"The estate has more services than a website can show at once. As tiles with a request button they become something guests use, and a line to Lisbon keeps the next stay inside the brand."],
chat:["Stay","Concierge chat","An answer bot built on the resort&rsquo;s own guest information, with the team behind it.",["Try &lsquo;breakfast&rsquo;, &lsquo;beefbar&rsquo;, &lsquo;spa&rsquo;, &lsquo;kids&rsquo;, &lsquo;bike&rsquo;, &lsquo;dogs&rsquo; or &lsquo;christmas&rsquo;.","Answers use the real hours, offers and policies from the website.","Anything else goes to the team: +351 269 449 376 or info@sublimecomporta.pt."],"The same questions come in every day, and the resort has already written the answers down. The app gives them in a second."],
checkout:["Stay","Check-out","The folio and a thank-you.",["Real: the December long-weekend offer for a Villa Room Standard: two nights for &euro;500 or three nights for &euro;700 (the third night at &euro;200), per room for two guests, including breakfast, access to the fitness and wellness facilities in both wings and a complimentary non-alcoholic minibar.","Illustrative: that this guest booked it. Requests added in the app show as to be confirmed.","The next stay is one tap away."],"A clear folio and a next-stay offer close the stay well, before the guest has left the estate."]};
